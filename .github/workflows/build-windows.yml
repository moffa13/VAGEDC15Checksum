name: Release Windows

on:
  push:
    tags:
      - "v*"          # git tag v1.2.0 && git push origin v1.2.0
  workflow_dispatch:   # lancement manuel (build + artefact, sans Release)

permissions:
  contents: write      # nécessaire pour créer la Release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # MSVC + CMake sont déjà installés sur windows-latest.
      # CMAKE_MSVC_RUNTIME_LIBRARY = runtime statique (/MT) : l'exe ne
      # dépend pas du Visual C++ Redistributable chez l'utilisateur.
      # (Requiert cmake_minimum_required >= 3.15 dans ton CMakeLists.)
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Rassemble l'exe et les fichiers à livrer dans dist/
      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem build/app -Recurse -Filter *.exe |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Copy-Item -Destination dist
          # Ajoute ici d'autres fichiers à livrer, par ex. :
          # Copy-Item VAGEDC15Logger.cfg dist
          Compress-Archive -Path dist/* -DestinationPath "VAGEDC15Logger-$ver-win64.zip"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: VAGEDC15Logger-win64
          path: "*.zip"

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true